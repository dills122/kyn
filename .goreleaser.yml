version: 2

project_name: kyn

before:
  hooks:
    - go test ./...

builds:
  - id: kyn
    main: ./cmd/kyn
    binary: kyn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    builds:
      - kyn
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^test:'
      - '^chore:'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
    - title: Docs
      regexp: '^docs(\(.+\))?:'
    - title: Build and CI
      regexp: '^(build|ci|refactor)(\(.+\))?:'
    - title: Other
      order: 999

release:
  draft: false
  replace_existing_draft: true
  header: |
    ## Kyn {{ .Tag }}

    Deterministic related-file policy checks for CI.

    ### What to expect in this release
    - Stable CLI behavior and deterministic outputs
    - Verified multi-platform binaries and container publishing
    - Policy/reporting improvements grouped by category below

    ### Quick start
    ```bash
    kyn check -c kyn.config.yaml --base origin/main --head HEAD --format json
    ```

  footer: |
    ### Install and verify
    1. Download the archive for your platform from release assets.
    2. Verify with `checksums.txt`.
    3. Run `kyn --help`.

    Docs: https://dills122.github.io/kyn/

dockers:
  - image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:{{ .Version }}-amd64
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:latest-amd64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:{{ .Version }}-arm64
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:latest-arm64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:{{ .Version }}
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:{{ .Version }}-amd64
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:{{ .Version }}-arm64
  - name_template: ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:latest
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:latest-amd64
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn:latest-arm64

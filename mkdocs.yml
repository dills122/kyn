site_name: Kyn
site_description: Deterministic related-file policy checks for CI
site_url: https://dills122.github.io/kyn/
repo_url: https://github.com/dills122/kyn
repo_name: dills122/kyn
theme:
  name: material
  palette:
    primary: teal
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
nav:
  - Home: site/index.md
  - Getting Started: site/getting-started.md
  - CI Guide: site/ci.md
  - Config & Rules: site/config.md
  - Presets: site/presets.md
  - Release: site/release.md

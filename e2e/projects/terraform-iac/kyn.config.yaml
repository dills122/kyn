version: 2

families:
  - id: terraform-module
    groups:
      source:
        include:
          - "terraform/**/*.tf"
      docs:
        include:
          - "terraform/**/README.md"
    kin:
      readme: "{dir}/README.md"

rules:
  - id: terraform-docs-sync
    family: terraform-module
    severity: warn
    if:
      changedAny: [source]
      kinExists: [readme]
    assert:
      kinChanged: [readme]
    message: "Terraform module changed but module README did not."

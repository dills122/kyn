site_name: Kyn
site_description: Deterministic related-file policy checks for local development and CI
site_url: https://dills122.github.io/kyn/
docs_dir: docs/site
repo_url: https://github.com/dills122/kyn
repo_name: dills122/kyn
theme:
  name: material
  palette:
    primary: teal
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Start here:
      - Install Kyn: install.md
      - Your first check: getting-started.md
      - How Kyn works: concepts.md
  - Apply it:
      - Configure families and rules: config.md
      - Choose and adapt a preset: presets.md
      - Frontend components: recipes/frontend.md
      - Go API tests: recipes/go-api.md
      - Terraform module docs: recipes/terraform.md
      - CI adoption: ci.md
  - Go deeper:
      - CLI and exit codes: reference.md
      - Troubleshooting: troubleshooting.md
      - Release notes:
          - v0.1.3: releases/v0.1.3.md
      - Release operations: release.md

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag whose Linux packages should be pushed to Fury"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # PAT with contents:write on dills122/homebrew-tap and dills122/scoop-bucket.
          # The default GITHUB_TOKEN is scoped to this repo only and cannot push to
          # the tap/bucket repos, so homebrew_casks/scoops publishing needs its own token.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # PAT that can push a version branch to dills122/winget-pkgs and open
          # a pull request against microsoft/winget-pkgs. If unset, GoReleaser
          # still publishes every other channel and skips the WinGet PR.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  fury:
    name: Publish Linux packages to Fury
    needs: goreleaser
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'push' && needs.goreleaser.result == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check Fury configuration
        env:
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
        run: |
          if [ -z "$FURY_ACCOUNT" ] || [ -z "$FURY_TOKEN" ]; then
            echo "::error::Set the FURY_ACCOUNT and FURY_TOKEN repository secrets before publishing to Fury."
            exit 1
          fi

      - name: Download Linux packages from the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --pattern '*.rpm' \
            --pattern '*.apk' \
            --dir dist

      # GoReleaser's native Fury integration is a Pro feature, so publish the
      # nfpm packages through Fury's HTTP push API. Keeping this in a separate
      # job lets a failed upload be retried without republishing the release.
      - name: Push packages to Fury
        env:
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
        run: |
          shopt -s nullglob
          pkgs=(dist/*.deb dist/*.rpm dist/*.apk)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::No .deb/.rpm/.apk packages were downloaded for $RELEASE_TAG."
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            echo "pushing $pkg to fury.io/$FURY_ACCOUNT"
            curl --silent --show-error --fail-with-body \
              --user "${FURY_ACCOUNT}:${FURY_TOKEN}" \
              --form package=@"$pkg" \
              "https://push.fury.io/${FURY_ACCOUNT}/"
            echo
          done

version: 2

project_name: kyn

before:
  hooks:
    - go test ./...

builds:
  - id: kyn
    main: ./cmd/kyn
    binary: kyn
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/dills122/kyn/internal/cli.Version={{ .Version }}
      - -X github.com/dills122/kyn/internal/cli.Commit={{ .Commit }}
      - -X github.com/dills122/kyn/internal/cli.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - kyn
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: kyn
    package_name: kyn
    ids:
      - kyn
    vendor: Dylan Steele
    homepage: "https://github.com/dills122/kyn"
    maintainer: "Dylan Steele <dylansteele57@gmail.com>"
    description: "Stateless CLI for enforcing related-file change policy in CI"
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^test:'
      - '^chore:'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
    - title: Docs
      regexp: '^docs(\(.+\))?:'
    - title: Build and CI
      regexp: '^(build|ci|refactor)(\(.+\))?:'
    - title: Other
      order: 999

release:
  draft: false
  replace_existing_draft: true
  header: |
    ## Kyn {{ .Tag }}

    Deterministic related-file policy checks for CI.

    ### What to expect in this release
    - Stable CLI behavior and deterministic outputs
    - Verified multi-platform binaries and container publishing
    - Policy/reporting improvements grouped by category below

    ### Quick start
    ```bash
    kyn check -c kyn.config.yaml --base origin/main --head HEAD --format json
    ```

  footer: |
    ### Install and verify
    - Go 1.22+: `go install github.com/dills122/kyn/cmd/kyn@{{ .Tag }}`
    - Or download the archive for your platform and verify it with `checksums.txt`.
    - Run `kyn --version` and `kyn --help`.

    Docs: https://dills122.github.io/kyn/

homebrew_casks:
  - name: kyn
    repository:
      owner: dills122
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/dills122/kyn"
    description: "Stateless CLI for enforcing related-file change policy in CI"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kyn"]
          end

scoops:
  - name: kyn
    repository:
      owner: dills122
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/dills122/kyn"
    description: "Stateless CLI for enforcing related-file change policy in CI"
    license: MIT

winget:
  - name: kyn
    publisher: Dylan Steele
    package_identifier: DylanSteele.Kyn
    package_name: Kyn
    ids:
      - default
    short_description: "Stateless CLI for enforcing related-file change policy in CI"
    description: "Kyn enforces deterministic related-file change policies in local development and CI."
    license: MIT
    license_url: "https://github.com/dills122/kyn/blob/main/LICENSE"
    publisher_url: "https://github.com/dills122"
    publisher_support_url: "https://github.com/dills122/kyn/issues"
    homepage: "https://github.com/dills122/kyn"
    release_notes_url: "https://github.com/dills122/kyn/releases/tag/{{ .Tag }}"
    tags:
      - cli
      - ci
      - golang
      - policy
    # Keep the other release channels working until the one-time WinGet token is
    # configured. Stable releases open a catalog PR whenever the token is present.
    skip_upload: '{{ if index .Env "WINGET_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    path: "manifests/d/DylanSteele/Kyn/{{ .Version }}"
    repository:
      owner: dills122
      name: winget-pkgs
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

dockers_v2:
  - id: kyn
    ids:
      - kyn
    images:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kyn
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false

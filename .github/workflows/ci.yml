name: CI

on:
  push:
    branches: ["main"]
  pull_request: {}

jobs:
  release-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Validate release configuration
        run: goreleaser check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir /tmp/kyn-site

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go version
        run: go version

      - name: Verify canonical module path
        run: make module-path

      - name: Format check
        run: |
          FILES="$(gofmt -l cmd internal)"
          if [ -n "$FILES" ]; then
            echo "Files need gofmt:"
            echo "$FILES"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Vet
        run: go vet ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.22.x", "stable"]
        # go1.22 is EOL and never got the linker fix for golang/go#68678
        # ("missing LC_UUID load command"), which crashes any go1.22 test
        # binary outright on current macos-latest runner images. go1.23+
        # has the fix; ubuntu/windows aren't affected by this dyld issue.
        exclude:
          - os: macos-latest
            go-version: "1.22.x"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Go version
        run: go version

      - name: Test
        run: go test ./cmd/... ./internal/...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run e2e project fixtures
        run: go test ./e2e/... -v

  windows-onboarding-e2e:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run PowerShell onboarding guidance E2E
        run: go test ./e2e -run TestInitGuidanceRunsInDeclaredShell -count=1 -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute coverage
        run: |
          go test ./internal/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Enforce minimum internal coverage
        run: |
          TOTAL="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          echo "Total coverage: ${TOTAL}%"
          awk "BEGIN {exit !(${TOTAL} >= 80.0)}"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build ./cmd/kyn

  linux-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            platform: linux/amd64
            image: debian:stable-slim
            label: debian-amd64
          - goarch: amd64
            platform: linux/amd64
            image: alpine:3.20
            label: alpine-amd64
          - goarch: arm64
            platform: linux/arm64
            image: debian:stable-slim
            label: debian-arm64
          - goarch: arm64
            platform: linux/arm64
            image: alpine:3.20
            label: alpine-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build static binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -o ./bin/kyn ./cmd/kyn

      - name: Smoke static binary
        run: |
          docker run --rm \
            --platform=${{ matrix.platform }} \
            -v "$PWD/bin/kyn:/usr/local/bin/kyn:ro" \
            ${{ matrix.image }} \
            /usr/local/bin/kyn --help
